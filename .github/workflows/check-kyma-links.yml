name: Verify markdown links in Kyma project

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  verify-links:
    strategy:
      fail-fast: false
      matrix:
        repository:
          - kyma
          - btp-manager
          - istio
          - serverless
          - telemetry-manager
          - eventing-manager
          - api-gateway
          - nats-manager
          - application-connector-manager
          - keda-manager  
          - community
          - cloud-manager
          - docker-registry
          - busola
          - registry-proxy
          - community-modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install 
        run: npm install
      - name: Checkout ${{matrix.repository}}
        uses: actions/checkout@v4
        with:
          repository: kyma-project/${{matrix.repository}}
          path: ${{matrix.repository}}
      - name: Verify links
        run: |
          cd ${{matrix.repository}}
          node ../md-check-link.js -q -n 8 -c ../.mlc.config.json ./

  slack-failed-notification:
    name: Slack Notification
    environment:
      name: notifications
      deployment: false
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs:
      - kyma-samples-links
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Notify
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          errors: true
          payload-templated: true
          payload: |
            repository: ${{ github.repository }},
            workflow: ${{ github.workflow }},
            link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"